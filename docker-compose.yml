services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nano
      POSTGRES_PASSWORD: nano
      POSTGRES_DB: nano_chat_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nano -d nano_chat_test"]
      interval: 5s
      timeout: 3s
      retries: 20
