services:
  postgres:
    image: ${POSTGRES_IMAGE:-mirror.gcr.io/library/postgres:17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nano}
      POSTGRES_DB: ${POSTGRES_DB:-nano_chat_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ${NANO_CHAT_IMAGE:-nano-chat:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-nano}:${POSTGRES_PASSWORD:-nano}@postgres:5432/${POSTGRES_DB:-nano_chat_test}}
      JWT_SECRET: ${JWT_SECRET:-change-me-development-secret-at-least-32-bytes}
      BIND_ADDR: ${BIND_ADDR:-0.0.0.0:3000}
      RUST_LOG: ${RUST_LOG:-nano_chat=debug,tower_http=info}
      NANO_CHAT_NOTIFY_CHANNEL: ${NANO_CHAT_NOTIFY_CHANNEL:-nano_chat_events}
      NANO_CHAT_MAX_CONNECTIONS_PER_USER: ${NANO_CHAT_MAX_CONNECTIONS_PER_USER:-10}
      NANO_CHAT_HEARTBEAT_INTERVAL_SECS: ${NANO_CHAT_HEARTBEAT_INTERVAL_SECS:-30}
      NANO_CHAT_HEARTBEAT_IDLE_TIMEOUT_SECS: ${NANO_CHAT_HEARTBEAT_IDLE_TIMEOUT_SECS:-90}
      NANO_CHAT_MAX_WS_PAYLOAD_BYTES: ${NANO_CHAT_MAX_WS_PAYLOAD_BYTES:-65536}
      NANO_CHAT_MAX_MESSAGE_BYTES: ${NANO_CHAT_MAX_MESSAGE_BYTES:-4096}
      TURN_PUBLIC_HOST: ${TURN_PUBLIC_HOST:-turn.example.com}
      TURN_REALM: ${TURN_REALM:-turn.example.com}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-change-me-turn-shared-secret-at-least-32-bytes}
      TURN_CREDENTIAL_TTL_SECS: ${TURN_CREDENTIAL_TTL_SECS:-600}
      TURN_STUN_URL: ${TURN_STUN_URL:-stun:turn.example.com:3478}
      TURN_UDP_URL: ${TURN_UDP_URL:-turn:turn.example.com:3478?transport=udp}
      TURN_TCP_URL: ${TURN_TCP_URL:-turn:turn.example.com:3478?transport=tcp}
    expose:
      - "3000"

  caddy:
    profiles: ["app"]
    image: caddy:2
    depends_on:
      app:
        condition: service_started
    environment:
      NANO_CHAT_DOMAIN: ${NANO_CHAT_DOMAIN:-chat.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  coturn:
    image: coturn/coturn:4
    command: ["-c", "/etc/coturn/turnserver.conf"]
    environment:
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-change-me-turn-shared-secret-at-least-32-bytes}
      TURN_REALM: ${TURN_REALM:-turn.example.com}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  caddy_data:
  caddy_config:
