name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nano
          POSTGRES_PASSWORD: nano
          POSTGRES_DB: nano_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nano -d nano_chat_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Backend and script checks
        env:
          DATABASE_URL: postgres://nano:nano@localhost:5432/nano_chat_test
          TEST_DATABASE_URL: postgres://nano:nano@localhost:5432/nano_chat_test
        run: |
          cargo test --lib
          cargo test --tests
          bash scripts/test-dev-tmux.sh
          bash -n scripts/dev-tmux.sh scripts/test-dev-tmux.sh

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Web checks
        working-directory: web
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
